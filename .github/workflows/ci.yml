name: NexusOne CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-long-enough-for-ci!!
      DATABASE_URL: postgres://test:test@localhost:5432/test_nexusone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run ESLint
        working-directory: backend
        run: npm run lint || true   # Warn but don't block on lint

  # ── Frontend Build ─────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://nexusone-backend.onrender.com/api/v1
          VITE_USE_MOCK: "false"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Deploy (only on main branch after tests pass) ──────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render Deploy (Backend)
        if: vars.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -H "Accept: application/json" | jq .

      - name: Trigger Render Deploy (Frontend)
        if: vars.RENDER_FRONTEND_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -H "Accept: application/json" | jq .

      - name: Deployment summary
        run: |
          echo "✅ Deployment triggered for main branch"
          echo "Backend: https://nexusone-backend.onrender.com"
          echo "Frontend: https://nexusone.onrender.com"
          echo "Health: https://nexusone-backend.onrender.com/api/v1/health"
